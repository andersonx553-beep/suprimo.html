name: Publicar Suprimo no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - v2/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar HTML
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r v2 _site/v2
          rm -rf _site/v2/tests
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
